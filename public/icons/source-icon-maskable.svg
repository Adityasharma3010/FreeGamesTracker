<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Maskable icons must be full-bleed (no transparency, no cut corners) —
       the OS applies its own mask shape (circle, squircle, etc). The
       clip-corner motif from the regular icon would look broken here. -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Glyph scaled down and centered so it survives a circular crop
       (Android's "safe zone" is roughly the center 66% diameter). -->
  <g transform="translate(146,206) scale(0.78)">
    <path d="
      M 60 0
      L 260 0
      C 300 0 330 30 336 68
      L 352 156
      C 358 194 332 228 296 228
      C 278 228 262 220 250 206
      L 224 176
      L 96 176
      L 70 206
      C 58 220 42 228 24 228
      C -12 228 -38 194 -32 156
      L -16 68
      C -10 30 20 0 60 0
      Z"
      fill="#ffffff"/>
    <rect x="24" y="70" width="18" height="52" rx="4" fill="#7c3aed"/>
    <rect x="4" y="90" width="58" height="18" rx="4" fill="#7c3aed"/>
    <circle cx="270" cy="76" r="13" fill="#7c3aed"/>
    <circle cx="298" cy="104" r="13" fill="#7c3aed"/>
    <circle cx="270" cy="132" r="13" fill="#7c3aed"/>
    <circle cx="242" cy="104" r="13" fill="#7c3aed"/>
  </g>
</svg>
